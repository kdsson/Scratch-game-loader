<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scratch Game Loader</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111111;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            width: 100%;
            max-width: 640px;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
        }
        .player-wrapper {
            position: relative;
            padding-bottom: 75%; /* 4:3 Aspect Ratio standard for Scratch */
            height: 0;
            overflow: hidden;
            background: #000;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
        .player-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Scratch Game Player</h1>
        
        <div class="player-wrapper">
            <!-- Replace 1328627533 with your desired Scratch Project ID -->
            <iframe 
                src="https://turbowarp.org" 
                allowtransparency="true" 
                allowfullscreen="true" 
                allow="geolocation; microphone; camera; gamepad">
            </iframe>
        </div>
    </div>

</body>
  </html>
