<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Scratch Game Loader</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111111;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            width: 90%;
            max-width: 640px;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        input {
            padding: 10px 15px;
            font-size: 1rem;
            border: 2px solid #444;
            border-radius: 6px;
            background-color: #222;
            color: #fff;
            width: 60%;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #855cd6;
        }
        button {
            padding: 10px 20px;
            font-size: 1rem;
            background-color: #855cd6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #6943b8;
        }
        .player-wrapper {
            position: relative;
            padding-bottom: 75%; /* 4:3 Aspect Ratio */
            height: 0;
            overflow: hidden;
            background: #000;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
        }
        .player-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Scratch Game Loader</h1>
        
        <div class="controls">
            <!-- Default placeholder ID provided -->
            <input type="text" id="projectIdInput" placeholder="Enter Scratch Project ID" value="1328627533">
            <button onclick="loadGame()">Load</button>
        </div>
        
        <div class="player-wrapper">
            <iframe 
                id="scratchPlayer"
                src="https://turbowarp.org" 
                allowtransparency="true" 
                allowfullscreen="true" 
                allow="geolocation; microphone; camera; gamepad">
            </iframe>
        </div>
    </div>

    <script>
        function loadGame() {
            // Get the input value and remove any accidental spaces
            const projectId = document.getElementById('projectIdInput').value.trim();
            
            // Check if the input is just numbers
            if (projectId && /^\d+$/.test(projectId)) {
                const player = document.getElementById('scratchPlayer');
                // Update the iframe source with the new ID
                player.src = `https://trampoline.turbowarp.org/api/projects/${projectId}`;
            } else {
                alert("Please enter a valid numeric Scratch Project ID.");
            }
        }

        // Allow pressing 'Enter' in the input box to load the game
        document.getElementById('projectIdInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                loadGame();
            }
        });
    </script>

</body>
    </html>
