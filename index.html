<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scratch Project Loader</title>
  <style>
    body { font: 16px system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    form { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1rem; }
    input, button { font: inherit; padding: .6rem; }
    input { flex: 1; min-width: 15rem; }
    #status { min-height: 1.5em; }
    iframe { display: block; width: 100%; aspect-ratio: 4 / 3; border: 0; background: #f2f2f2; }
  </style>
</head>
<body>
  <h1>Scratch Project Loader</h1>
  <form id="loader-form">
    <label for="project-id">Scratch Project ID</label>
    <input id="project-id" name="projectId" inputmode="numeric" autocomplete="off" placeholder="e.g. 123456789" required>
    <button type="submit">Load</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <iframe id="player" title="Scratch project player" allowfullscreen hidden></iframe>

  <script>
    const form = document.querySelector('#loader-form');
    const projectIdInput = document.querySelector('#project-id');
    const status = document.querySelector('#status');
    const player = document.querySelector('#player');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const projectId = projectIdInput.value.trim();

      // Project IDs are numeric. Validate before using the value in a URL.
      if (!/^\d+$/.test(projectId)) {
        player.hidden = true;
        player.removeAttribute('src');
        status.textContent = 'Enter a numeric Scratch Project ID.';
        return;
      }

      status.textContent = 'Checking project…';
      player.hidden = true;
      player.removeAttribute('src');

      try {
        const response = await fetch(`https://api.scratch.mit.edu/projects/${projectId}`);
        if (!response.ok) {
          throw new Error(response.status === 404 ? 'Project not found.' : `Scratch API returned HTTP ${response.status}.`);
        }

        const project = await response.json();
        if (!project || String(project.id) !== projectId) {
          throw new Error('Scratch returned unexpected project data.');
        }

        // The metadata request verifies that the project exists. TurboWarp hosts the player.
        player.src = `https://turbowarp.org/${projectId}/embed`;
        player.title = project.title ? `Scratch project: ${project.title}` : 'Scratch project player';
        player.hidden = false;
        status.textContent = project.title ? `Loaded: ${project.title}` : 'Project loaded.';
      } catch (error) {
        status.textContent = error instanceof TypeError
          ? 'Could not reach the Scratch API. Check your connection and try again.'
          : error.message;
      }
    });
  </script>
</body>
</html>
